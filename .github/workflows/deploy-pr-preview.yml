# Auto-generated by Scry Storybook Deployer
# Deploy Storybook preview for pull requests

name: Deploy Storybook PR Preview

on:
  pull_request:
    types: [opened, synchronize, reopened]

jobs:
  deploy-preview:
    runs-on: ubuntu-latest

    permissions:
      contents: read
      pull-requests: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v2
        with:
          version: 8
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'

      - name: Install dependencies
        run: CI=false pnpm install

      - name: Build Storybook
        run: pnpm run build-storybook

      - name: Deploy Preview
        id: deploy
        run: |
          # Deploy with PR-specific version
          npx @scry/storybook-deployer \
            --dir ./storybook-static \
            --version pr-${{ github.event.pull_request.number }}

          # Construct deployment URL using VIEW_URL (where users access the deployed Storybook)
          # VIEW_URL should be set to https://view.scrymore.com or your custom domain
          PROJECT_ID="${{ vars.SCRY_PROJECT_ID }}"
          VIEW_URL="${{ vars.SCRY_VIEW_URL || 'https://view.scrymore.com' }}"
          DEPLOY_URL="${VIEW_URL}/${PROJECT_ID}/pr-${{ github.event.pull_request.number }}"
          echo "deployment_url=$DEPLOY_URL" >> $GITHUB_OUTPUT
        env:
          STORYBOOK_DEPLOYER_API_URL: ${{ vars.SCRY_API_URL }}
          STORYBOOK_DEPLOYER_PROJECT: ${{ vars.SCRY_PROJECT_ID }}
          STORYBOOK_DEPLOYER_API_KEY: ${{ secrets.SCRY_API_KEY }}

      - name: Comment on PR
        uses: actions/github-script@v7
        with:
          script: |
            const deploymentUrl = '${{ steps.deploy.outputs.deployment_url }}';
            const prNumber = context.issue.number;
            const commitSha = context.payload.pull_request.head.sha.substring(0, 7);
            const branch = '${{ github.event.pull_request.head.ref }}';
            const deployedAt = new Date().toUTCString();

            const commentBody = [
              '## 🚀 Storybook Preview Deployed',
              '',
              '**Preview URL:** ' + deploymentUrl,
              '',
              '📌 **Details:**',
              '- **Commit:** ' + commitSha,
              '- **Branch:** ' + branch,
              '- **Deployed at:** ' + deployedAt,
              '',
              '> This preview updates automatically on each commit to this PR.'
            ].join('\n');

            // Check if a comment from this bot already exists
            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: prNumber,
            });

            const botComment = comments.find(comment =>
              comment.user.type === 'Bot' &&
              comment.body.includes('🚀 Storybook Preview Deployed')
            );

            if (botComment) {
              // Update existing comment
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: botComment.id,
                body: commentBody
              });
              console.log('Updated existing PR comment');
            } else {
              // Create new comment
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: prNumber,
                body: commentBody
              });
              console.log('Created new PR comment');
            }
