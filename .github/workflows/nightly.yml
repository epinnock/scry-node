name: Snapshot Release

on:
  push:
    branches: [stage]
    paths-ignore: ['**/*.md', 'docs/**']
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:

concurrency:
  group: snapshot-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  snapshot:
    name: Publish snapshot
    # Manual runs are limited to the two release branches. Schedules use main.
    if: github.ref == 'refs/heads/stage' || github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    env:
      SNAPSHOT_TAG: ${{ github.ref == 'refs/heads/stage' && 'next' || 'nightly' }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'
          registry-url: 'https://registry.npmjs.org'

      - name: Check publishing credentials
        run: |
          if [ -z "$NODE_AUTH_TOKEN" ]; then
            echo '::error::Configure the repository NPM_TOKEN secret with publish access.'
            exit 1
          fi
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --prefer-offline

      - name: Test
        run: pnpm exec jest --runInBand

      - name: Prepare snapshot changeset
        # Stable release PRs consume all changesets. Seed a patch in this checkout
        # so snapshots also work immediately after a release (or for CI changes).
        # Neither this changeset nor the generated version is committed.
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const { name } = require('./package.json');
          fs.writeFileSync('.changeset/ci-snapshot.md', `---\n"${name}": patch\n---\n\nCI snapshot.\n`);
          NODE

      - name: Create snapshot version
        run: pnpm exec changeset version --snapshot "$SNAPSHOT_TAG"

      - name: Verify snapshot channel and version
        run: |
          node <<'NODE'
          const { version } = require('./package.json');
          const tag = process.env.SNAPSHOT_TAG;
          if (!['next', 'nightly'].includes(tag) || !version.includes(`-${tag}.`)) {
            throw new Error(`Refusing to publish version ${version} to channel ${tag}`);
          }
          console.log(`Snapshot: ${version} (${tag})`);
          NODE

      - name: Publish snapshot
        run: pnpm exec changeset publish --tag "$SNAPSHOT_TAG" --no-git-tag
        env:
          # setup-node's registry authentication reads NODE_AUTH_TOKEN.
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Summary
        run: |
          VERSION=$(node -p "require('./package.json').version")
          {
            echo "## Snapshot published"
            echo "Package: @scrymore/scry-deployer@$VERSION"
            echo "Channel: $SNAPSHOT_TAG"
            echo "Commit: $GITHUB_SHA"
            echo "Install: npm install @scrymore/scry-deployer@$SNAPSHOT_TAG"
          } >> "$GITHUB_STEP_SUMMARY"
